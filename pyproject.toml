[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bundestag-mcp"
version = "0.1.0"
description = "MCP server providing access to German Bundestag parliamentary data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Oguzhan" }
]
keywords = ["mcp", "bundestag", "parliament", "germany", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0.0",
    "bundestag-api>=0.1.0",
    "pandas>=2.0.0",  # Required by bundestag-api
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    # API dependencies
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sse-starlette>=2.0.0",
    "slowapi>=0.1.9",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
]
semantic = [
    "sentence-transformers>=2.3.0",
]

[project.scripts]
bundestag-mcp = "bundestag_mcp.server:main"
bundestag-api = "bundestag_mcp.api.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bundestag_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
